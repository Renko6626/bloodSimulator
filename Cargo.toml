[workspace]
members = ["crates/simulation", "crates/godot_bridge"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
rapier2d = "=0.36.1"
godot = { version = "=0.5.5", default-features = false, features = ["api-4-7"] }

[profile.dev.package."*"]
opt-level = 2

# Keep the project's geometry and velocity sampling optimized alongside Rapier.
[profile.dev.package.simulation]
opt-level = 2
