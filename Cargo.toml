[workspace]
members = ["crates/simulation", "crates/godot_bridge", "crates/fluid", "crates/fluid-gpu", "crates/fluid-bench"]
default-members = ["crates/simulation", "crates/godot_bridge"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
rapier2d = { version = "=0.36.1", features = ["parallel"] }
rayon = "=1.12.0"
godot = { version = "=0.5.5", default-features = false, features = ["api-4-7"] }
faer = { version = "=0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "metal", "wgsl", "naga-ir"] }
pollster = "=0.4.0"
bytemuck = { version = "=1.25.2", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 2

# Keep the project's geometry and velocity sampling optimized alongside Rapier.
[profile.dev.package.simulation]
opt-level = 2
