[package]
name = "lbm-gpu-lab"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "metal", "wgsl", "naga-ir"] }
pollster = "=0.4.0"
bytemuck = { version = "=1.25.2", features = ["derive"] }
rapier2d = { version = "=0.36.1", features = ["parallel"] }
rayon = "=1.12.0"
serde_json = "=1.0.154"
