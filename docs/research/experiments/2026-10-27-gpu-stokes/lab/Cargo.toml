[package]
name = "blood-gpu-stokes-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace]

[dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "metal", "wgsl", "naga-ir"] }
pollster = "=0.4.0"
bytemuck = { version = "=1.25.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
faer = { version = "=0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
